<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">

    <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-5 py-3">

        <!-- Identidad / título -->
        <div class="flex items-center gap-3">
            <div
                class="flex h-10 w-10 items-center justify-center rounded-xl bg-fuchsia-100 text-fuchsia-600">
                <i class="pi pi-briefcase"></i>
            </div>

            <div class="hidden sm:block">
                <p class="text-sm font-semibold text-slate-700">
                    Administración
                </p>
                <p class="text-xs text-slate-400">
                    Panel de encuestas
                </p>
            </div>
        </div>

        <!-- Acciones -->
        @if (AuthService.isLoggedIn() && !AuthService.isAdmin()) {

        <div class="flex items-center gap-2">

            <!-- Enviar encuesta -->
            <button
                type="button"
                (click)="enviarEncuesta()"
                class="inline-flex items-center gap-2 rounded-xl bg-fuchsia-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-fuchsia-700 hover:shadow-md">

                <i class="pi pi-send text-sm"></i>

                <span class="hidden sm:inline">
                    Enviar encuesta
                </span>

            </button>

            <!-- Cerrar sesión -->
            <button
                type="button"
                (click)="cerrarSesion()"
                class="inline-flex items-center gap-2 rounded-xl border border-red-200 bg-white px-4 py-2.5 text-sm font-semibold text-red-500 transition-all hover:bg-red-50">

                <i class="pi pi-sign-out text-sm"></i>

                <span class="hidden sm:inline">
                    Cerrar sesión
                </span>

            </button>

        </div>

        }

    </nav>

</header>
