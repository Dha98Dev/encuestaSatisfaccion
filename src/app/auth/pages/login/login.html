<div class="flex min-h-screen items-center justify-center">
  <div class="flex flex-col w-full max-w-md px-8 py-10 bg-white border border-slate-200 rounded-2xl shadow-sm">
    <!-- Logo y título -->
    <div class="text-center">
      <img src="/assets/images/w_Escudo.png" alt="Logo" class="mx-auto h-12 w-auto" />
      <h2 class="mt-6 text-2xl font-semibold text-gray-900">
        Ingresa con tu cuenta
      </h2>
    </div>

    <!-- Formulario -->
    <div class="mt-8">
      <form action="#" method="POST" class="space-y-6" [formGroup]="login" (ngSubmit)="iniciarSesion()">

        <div>
          <label class="block text-sm font-medium text-gray-700">
            Usuario o correo electrónico
          </label>
          <input
            type="email"
            required
            formControlName="usuario"
            class="mt-2 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-[var(--oscuro-inst)] focus:ring-1 focus:ring-[var(--oscuro-inst)] outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">
            Contraseña
          </label>
          <input
            type="password"
            required
            formControlName="password"
            class="mt-2 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-[var(--oscuro-inst)] focus:ring-1 focus:ring-[var(--oscuro-inst)] outline-none"
          />
        </div>

        <button
          type="submit"
          class="w-full rounded-md bg-[var(--oscuro-inst)] py-2 text-sm font-semibold text-white transition hover:bg-[var(--oscuro-calido)]"
        >
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>
</div>
